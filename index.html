<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Arduino Sandbox</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="app">
            <h1>Arduino Sandbox</h1>
            <div id="board_div">
            </div>

            <button id="toggle"> Current Mode: INSPECT (Click to Change)</button>

            <div id="controls" style="margin-top: 20px; display: lex; gap: 10px; align-items: center;">
                <select id="component-dropdown">
                    <option value="led">LED</option>
                </select>
                <button id="add-btn">Add Component</button>
            </div>

            <div id="context-menu" class="hidden-menu">
                <div class="menu-item" style="color: #00ff66;" data-action="toggle">Toggle ON / OFF</div>
                <hr>
                <div class="menu-item" data-action="red">Make Red</div>
                <div class="menu-item" data-action="green">Make Green</div>
                <div class="menu-item" data-action="blue">Make Blue</div>
                <div class="menu-item" data-action="yellow">Make Yellow</div>
                <hr>
                <div class="menu-item remove-item" data-action="remove">Remove LED</div>
            </div>


            <div id="monitor">
                >system ready click a pin to inspect it...
            </div>
            <div id="editor-container" style="width: 100%; height: 400px; margin-top: 20px; border: 2px solid #00d5ff; border-radius: 8px; overflow: hidden;"></div>

        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
