<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Arduino Sandbox</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
        <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
        <script src="https://unpkg.com/blockly/msg/en.js"></script>
    </head>
    <body>
        <div id="app">
            <h1>Arduino Sandbox</h1>
            <div id="board_div">
                <!-- Floating Zoom Controls -->
                <div id="zoom-controls">
                    <button id="btn-zoom-in">+</button>
                    <button id="btn-zoom-out">-</button>
                </div>
            </div>

            <button id="toggle"> Current Mode: INSPECT (Click to Change)</button>

            <div id="controls" style="margin-top: 20px; display: flex; gap: 10px; align-items: center;">
                <select id="component-dropdown">
                    <option value="led">LED (5mm)</option>
                    <option value="button">Push Button</option>
                    <option value="servo">Servo Motor (SG90)</option>
                </select>
                <button id="add-btn">Add Component</button>
            </div>

            <div id="context-menu" class="hidden-menu">
                <div class="menu-item led-opt" style="color: #00ff66;" data-action="toggle">Toggle ON / OFF</div>
                <hr class="led-opt hr-opt">
                <div class="menu-item led-opt" data-action="red">Make Red</div>
                <div class="menu-item led-opt" data-action="green">Make Green</div>
                <div class="menu-item led-opt" data-action="blue">Make Blue</div>
                <div class="menu-item led-opt" data-action="yellow">Make Yellow</div>
                
                <div class="menu-item servo-opt" style="color: #00d5ff;" data-action="rotate-servo">Test Rotation (45°)</div>
                <hr class="hr-opt">
                
                <div class="menu-item remove-item" data-action="remove">Remove Component</div>
            </div>


            <div id="monitor">
                >system ready click a pin to inspect it...
            </div>
            <!-- Dual-Mode Editor Section -->
            <div id="mode-tabs">
                <button id="tab-easy" class="active-tab">EASY (Blocks)</button>
                <button id="tab-adv">ADVANCED (C++ Code)</button>
            </div>
            
            <div id="editor-container" style="width: 100%; height: 400px; border: 2px solid #00d5ff; border-radius: 0 8px 8px 8px; overflow: hidden; background-color: #0a0a1a;">
                
                <!-- EASY MODE: Blockly Workspace -->
                <div id="blocklyDiv" style="height: 100%; width: 100%;"></div>
                
<!-- ADVANCED MODE: Text Editor -->
                <textarea id="code-editor" style="display: none;" spellcheck="false">
void setup() {
  // Initialize your pins here
}

void loop() {
  // Write your main code here
}
                </textarea>
            </div>

            <!-- Blockly Toolbox (The menu of blocks) -->
            <xml id="toolbox" style="display: none">
              <!-- NEW: Custom Arduino Blocks -->
              <category name="Arduino" colour="#00979D">
                <block type="digital_write"></block>
                <block type="digital_read"></block>
                <block type="servo_write"></block>
                <block type="delay_ms"></block>
                <block type="serial_print"></block>
              </category>
              
              <!-- Standard Blocks -->
              <category name="Logic" colour="210">
                <block type="controls_if"></block>
                <block type="logic_compare"></block>
                <block type="logic_operation"></block>
                <block type="logic_boolean"></block>
              </category>
              <category name="Loops" colour="120">
                <block type="controls_repeat_ext"></block>
                <block type="controls_whileUntil"></block>
              </category>
              <category name="Math" colour="230">
                <block type="math_number"></block>
                <block type="math_arithmetic"></block>
              </category>
              <category name="Text" colour="160">
                <block type="text"></block>
                <block type="text_join"></block>
              </category>
              <!-- Built-in Variables Engine -->
              <category name="Variables" colour="330" custom="VARIABLE"></category>
            </xml>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
